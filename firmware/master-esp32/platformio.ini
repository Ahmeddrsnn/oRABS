[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitm-1  ; Native USB ESP32-S3
framework = arduino

; Serial Monitor (Native USB)
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1  ; Native USB Serial
    -DBOARD_HAS_PSRAM
    -DUSB_PRODUCT='"Glove Leak Tester"'
    -DUSB_MANUFACTURER='"LCC"'
    
upload_flags = 
    --no-stub
    
build_unflags = 
    -DBOARD_FLASH_SIZE=0x800000

board_upload.flash_size = 4MB
board_build.partitions = default.csv
    
; CPU frequency
board_build.f_cpu = 240000000L

; Flash configuration
board_build.flash_mode = dio

; Libraries
lib_deps = 
    bblanchon/ArduinoJson@^7.0.0

; Upload configuration
; DIKKAT: Port numaralarini degistirmeyin! 
upload_speed = 115200
upload_port = COM6
monitor_port = COM6
