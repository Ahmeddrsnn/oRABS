[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitm-1  ; 4MB flash board
framework = arduino

; Serial Monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build flags
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_ERROR  ; Disable WiFi debug spam

; Enable PSRAM for larger heap and OTA operations
board_build.psram = oc  ; octal (fast mode) - or "qio" for quad mode
    
build_unflags = 
    -DBOARD_FLASH_SIZE=0x800000

board_upload.flash_size = 4MB
board_build.partitions = default.csv
    
; CPU frequency
board_build.f_cpu = 240000000L

; Flash configuration
board_build.flash_mode = qio
board_build.flash_size = 4MB
; board_build.partitions = default_4MB.csv  ; Commented out - using default

; Libraries
lib_deps = 
    Wire
    SPI
    https://github.com/arduino12/rdm6300
    bblanchon/ArduinoJson@^7.0.0
    NorthernWidget/DS3231
    ArduinoOTA

; Upload configuration
; DIKKAT: Port numaralarini degistirmeyin! Yanlis porta yukleme yapilabilir.
upload_speed = 921600
upload_port = COM19
monitor_port = COM19
